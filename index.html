<title>IIDX 难度表点灯</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#12141a; --panel:#1b1e26; --panel2:#232733; --line:#2f3442;
  --fg:#e7e9ee; --dim:#9aa2b1;
  --NOPLAY:#ffffff; --FAILED:#9aa0a6; --AC:#b06be0; --EC:#37c05a;
  --NC:#3d8bff; --HC:#ef4444; --EXC:#f5c400; --FC:#22d3ee;
}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:14px/1.4 -apple-system,"Noto Sans SC","Segoe UI",Roboto,sans-serif;
     padding-bottom:env(safe-area-inset-bottom)}

/* ---------- 顶栏 ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);
     border-bottom:1px solid var(--line);padding:8px 10px 6px;
     padding-top:calc(8px + env(safe-area-inset-top))}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
     background:var(--panel);color:var(--dim);font-size:13px;font-weight:600;white-space:nowrap}
.tab.on{background:#2d3a52;border-color:#4a5f86;color:#fff}
.summary{display:flex;gap:8px;margin-top:8px}
.sum{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 9px}
.sum .lab{font-size:11px;color:var(--dim);letter-spacing:.5px}
.sum .val{font-size:19px;font-weight:700;line-height:1.15;margin-top:1px}
.sum .rest{font-size:12px;color:var(--dim);font-weight:500;margin-left:4px}
.sum.ec .val{color:var(--EC)} .sum.hc .val{color:var(--HC)}
.tools{display:flex;gap:6px;align-items:center;margin-top:7px}
.tools select,.tools button{background:var(--panel);color:var(--fg);border:1px solid var(--line);
     border-radius:8px;padding:5px 9px;font-size:12px;font-family:inherit}
.tools .sp{flex:1}
.tools .fcount{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;
      white-space:nowrap}

/* ---------- 概览条状图 ---------- */
.ov{padding:10px}
.ov h2,.sec h2{font-size:12px;color:var(--dim);margin:0 0 8px;font-weight:600;letter-spacing:1px}
.ovrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ovname{flex:0 0 62px;font-size:12px;font-weight:600;text-align:right;color:var(--fg);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{flex:1;height:14px;border-radius:4px;overflow:hidden;display:flex;background:#0d0f14}
.bar i{display:block;height:100%}
.ovnum{flex:0 0 62px;font-size:11px;color:var(--dim);text-align:right;
      white-space:nowrap;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:10px;font-size:11px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:2px;display:block}

/* ---------- 分段 ---------- */
.sec{border-top:1px solid var(--line);padding:10px}
.sechead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sechead .nm{font-size:15px;font-weight:700}
.sechead .st{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.sechead .tg{margin-left:auto;color:var(--dim);font-size:12px}
.sec.fold .grid,.sec.fold .bar{display:none}
.sec.empty{display:none}
.grid{display:grid;gap:5px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));margin-top:8px}

/* ---------- 谱面方格 ---------- */
.cell{position:relative;border-radius:7px;padding:4px 5px 3px;min-height:58px;
      display:flex;flex-direction:column;color:#111;overflow:hidden;
      border:1px solid rgba(0,0,0,.25);background:var(--NOPLAY)}
.cell .ct{display:flex;align-items:center;gap:4px;font-size:9px;font-weight:800;letter-spacing:.3px}
.cell .ct b{background:rgba(0,0,0,.78);border-radius:3px;padding:0 3px;line-height:13px;color:#fff}
/* 谱面类型配色: N蓝 H黄 A红 L紫 (B绿) */
.cell .ct b.tB{color:#7ee787} .cell .ct b.tN{color:#5aa9ff} .cell .ct b.tH{color:#ffd23f}
.cell .ct b.tA{color:#ff6b6b} .cell .ct b.tL{color:#c98bff}
/* 初出代数徽章 */
.cell .ct u{text-decoration:none;border:1px solid rgba(0,0,0,.45);border-radius:3px;
      padding:0 2px;line-height:12px;font-weight:800;opacity:.75}
.cell.s-AC .ct u,.cell.s-NC .ct u,.cell.s-HC .ct u{border-color:rgba(255,255,255,.55)}
.cell .lv{margin-left:auto;opacity:.65;font-weight:700}
.cell .tt{flex:1;font-size:10.5px;line-height:1.22;font-weight:600;margin-top:3px;
      overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3}
.cell .bt{display:flex;align-items:baseline;gap:4px;font-size:8.5px;opacity:.6;font-weight:700;
      letter-spacing:.2px;white-space:nowrap;overflow:hidden}
.cell .bt .nt{margin-left:auto}
.cell .pick{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;appearance:none}
.cell.s-NOPLAY{background:var(--NOPLAY)} .cell.s-FAILED{background:var(--FAILED)}
.cell.s-AC{background:var(--AC)} .cell.s-EC{background:var(--EC)}
.cell.s-NC{background:var(--NC)} .cell.s-HC{background:var(--HC)}
.cell.s-EXC{background:var(--EXC)} .cell.s-FC{background:var(--FC)}
.cell.s-AC,.cell.s-NC,.cell.s-HC{color:#fff}
.cell.hide{display:none}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:#000c;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;
  opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.warn{background:#4a2a12;border:1px solid #8a5a22;color:#ffd9a8;font-size:12px;
  padding:8px 10px;margin:8px 10px;border-radius:8px;line-height:1.5}
</style>

  </div>
</div>

const ST = [
  ['NOPLAY','NOPLAY'],['FAILED','FAILED'],['AC','ASSIST CLEAR'],['EC','EASY CLEAR'],
  ['NC','CLEAR'],['HC','HARD CLEAR'],['EXC','EX HARD CLEAR'],['FC','FULL COMBO']
];
const RANK = {}; ST.forEach(([k],i)=>RANK[k]=i);
const EC_R = RANK.EC, HC_R = RANK.HC;
const CT = {0:'SPB',1:'SPN',2:'SPH',3:'SPA',4:'SPL',5:'DPB',6:'DPN',7:'DPH',8:'DPA',9:'DPL'};
const TIER = ['B','N','H','A','L'];
const KEY = 'iidx_clear_v1';

/* ---------- 存档 ---------- */
let store = {}, storageOK = true;
try {
  localStorage.setItem('__t','1'); localStorage.removeItem('__t');
  const raw = localStorage.getItem(KEY);
  if (raw) store = JSON.parse(raw) || {};
} catch (e) { storageOK = false; }

function save(){
  if(!storageOK) return;
  try { localStorage.setItem(KEY, JSON.stringify(store)); }
  catch(e){ storageOK = false; showWarn(); }
}
function showWarn(){
  document.getElementById('warn').innerHTML =
    '<div class="warn">⚠️ 当前环境无法持久保存（多见于用 file:// 直接打开）。'
    + '本次修改只存在内存里，关掉页面就没了。请把本文件放到静态托管（如 GitHub Pages）用 http(s) 打开，'
    + '或随时点「导出备份」保存进度。</div>';
}
if(!storageOK) showWarn();

const st = k => store[k] || 'NOPLAY';
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 状态 ---------- */
let cur = 0, filter = 'all';
const OPTS = ST.map(([k,n]) => `<option value="${k}">${n}</option>`).join('');

// 筛选项：lt:XXX = 只看低于该程度的（即未完成），ST 跳过 NOPLAY/FAILED
const FOPTS = [['all', '显示全部']]
  .concat(ST.slice(2).map(([k, n]) => ['lt:' + k, `只看未达 ${k}（${n}）`]))
  .concat([['noplay', '只看 NOPLAY'], ['played', '只看已点灯']]);
document.getElementById('filter').innerHTML =
  FOPTS.map(([v, n]) => `<option value="${v}">${n}</option>`).join('');

/* ---------- 渲染 ---------- */
function renderTabs(){
  document.getElementById('tabs').innerHTML = DATA.map((t,i)=>
    `<button class="tab${i===cur?' on':''}" data-i="${i}">${esc(t.title)}</button>`).join('');
}

function renderTable(){
  const t = DATA[cur];
  let h = `<div class="ov"><h2>分段进度</h2>${t.groups.map((g,i)=>ovRow(g,i)).join('')}
    <div class="legend">${ST.map(([k,n])=>`<span><i style="background:var(--${k})"></i>${n}</span>`).join('')}</div></div>`;
  h += t.groups.map((g,i)=>`
    <section class="sec" id="g${i}">
      <div class="sechead" data-fold="${i}">
        <span class="nm">${esc(g.name)}</span>
        <span class="st" id="gs${i}"></span>
        <span class="tg">▾</span>
      </div>
      <div class="bar" id="gb${i}"></div>
      <div class="grid">${g.charts.map(cell).join('')}</div>
    </section>`).join('');
  document.getElementById('app').innerHTML = h;
  // 让每个下拉菜单显示该谱面当前的状态
  document.querySelectorAll('.cell').forEach(el=>{ el.querySelector('.pick').value = st(el.dataset.k); });
  refresh();
}

function ovRow(g,i){
  return `<div class="ovrow" data-jump="${i}">
    <span class="ovname">${esc(g.name)}</span>
    <span class="bar" id="ob${i}"></span>
    <span class="ovnum" id="on${i}"></span></div>`;
}

function cell(c){
  const [mid,ct,title,label,lv,notes] = c, k = mid+':'+ct, s = st(k);
  const tier = TIER[ct % 5];   // 0/5=B 1/6=N 2/7=H 3/8=A 4/9=L
  const gen = Math.floor(mid / 1000);   // musicId 去掉末三位 = 初出代数
  return `<div class="cell s-${s}" data-k="${k}" data-r="${RANK[s]}">
      <div class="ct"><b class="t${tier}">${CT[ct]||'T'+ct}</b><u title="初出代数">${gen}代</u><span class="lv">☆${lv}</span></div>
      <div class="tt">${esc(title)}</div>
      <div class="bt"><span>${label}</span><span class="nt">${notes} notes</span></div>
      <select class="pick" data-k="${k}">${OPTS}</select>
    </div>`;
}

/* ---------- 统计刷新（不重建方格） ---------- */
function counts(charts){
  const n = new Array(8).fill(0);
  for (const c of charts) n[RANK[st(c[0]+':'+c[1])]]++;
  return n;
}
function barHTML(n, total){
  return ST.map(([k],i)=> n[i] ? `<i style="background:var(--${k});width:${n[i]/total*100}%"></i>` : '').join('');
}
function sum(n, from){ let s=0; for(let i=from;i<8;i++) s+=n[i]; return s; }

function refresh(){
  const t = DATA[cur];
  const all = new Array(8).fill(0);
  t.groups.forEach((g,i)=>{
    const n = counts(g.charts), tot = g.charts.length;
    n.forEach((v,j)=>all[j]+=v);
    const ec = sum(n,EC_R), hc = sum(n,HC_R);
    const bar = barHTML(n,tot);
    const ob = document.getElementById('ob'+i); if(ob) ob.innerHTML = bar;
    const on = document.getElementById('on'+i); if(on) on.textContent = `${ec}/${tot}`;
    const gb = document.getElementById('gb'+i); if(gb) gb.innerHTML = bar;
    const gs = document.getElementById('gs'+i);
    if(gs) gs.textContent = `EC+ ${ec}/${tot} · HC+ ${hc}`;
  });
  const tot = all.reduce((a,b)=>a+b,0), ec = sum(all,EC_R), hc = sum(all,HC_R);
  document.getElementById('sEC').innerHTML = `${ec}<span class="rest">(余 ${tot-ec})</span>`;
  document.getElementById('sHC').innerHTML = `${hc}<span class="rest">(余 ${tot-hc})</span>`;
}

function applyFilter(){
  // lt:XXX → 只显示强度低于 XXX 的谱面，已达标的全部隐藏
  const lt = filter.startsWith('lt:') ? RANK[filter.slice(3)] : -1;
  let shown = 0;
  document.querySelectorAll('.cell').forEach(el=>{
    const r = +el.dataset.r;
    let show = true;
    if (lt >= 0) show = r < lt;
    else if (filter==='noplay') show = r === 0;
    else if (filter==='played') show = r > 0;
    el.classList.toggle('hide', !show);
    if (show) shown++;
  });
  // 整段都被筛掉就把分段也收起来，不留空标题
  document.querySelectorAll('.sec').forEach(sec=>{
    sec.classList.toggle('empty', !sec.querySelector('.cell:not(.hide)'));
  });
  document.getElementById('fcount').textContent =
    filter === 'all' ? '' : `剩 ${shown} 首`;
}

/* ---------- 交互 ---------- */
document.getElementById('tabs').onclick = e=>{
  const b = e.target.closest('.tab'); if(!b) return;
  cur = +b.dataset.i; renderTabs(); renderTable(); applyFilter(); scrollTo(0,0);
};

const app = document.getElementById('app');
app.addEventListener('change', e=>{
  const sel = e.target.closest('.pick'); if(!sel) return;
  const k = sel.dataset.k, v = sel.value;
  if (v === 'NOPLAY') delete store[k]; else store[k] = v;
  save();
  // 同一谱面可能出现在多张表 / 多个位置，一起更新
  document.querySelectorAll(`.cell[data-k="${k}"]`).forEach(el=>{
    el.className = 'cell s-' + v;
    el.dataset.r = RANK[v];
    el.querySelector('.pick').value = v;
  });
  refresh(); applyFilter();
});
app.addEventListener('click', e=>{
  const j = e.target.closest('[data-jump]');
  if (j){ document.getElementById('g'+j.dataset.jump).scrollIntoView({behavior:'smooth'}); return; }
  const f = e.target.closest('[data-fold]');
  if (f) f.closest('.sec').classList.toggle('fold');
});
document.getElementById('filter').onchange = e=>{ filter = e.target.value; applyFilter(); };

/* ---------- 备份 ---------- */
function toast(m){ const t=document.getElementById('toast'); t.textContent=m;
  t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),2200); }

document.getElementById('btnExp').onclick = ()=>{
  const blob = new Blob([JSON.stringify({app:'iidx-table',v:1,at:new Date().toISOString(),clears:store},null,0)],
                        {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `iidx-clears-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(`已导出 ${Object.keys(store).length} 条记录`);
};
document.getElementById('btnImp').onclick = ()=> document.getElementById('fileImp').click();
document.getElementById('fileImp').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      const c = d.clears || d;
      if (typeof c !== 'object') throw 0;
      let n = 0;
      for (const k in c) if (RANK[c[k]] !== undefined && c[k] !== 'NOPLAY'){ store[k] = c[k]; n++; }
      save(); renderTable(); applyFilter(); toast(`已导入 ${n} 条记录`);
    }catch(err){ toast('文件格式不对'); }
  };
  r.readAsText(f);
  e.target.value = '';
};

/* ---------- 启动 ---------- */
renderTabs(); renderTable();
if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
  navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
